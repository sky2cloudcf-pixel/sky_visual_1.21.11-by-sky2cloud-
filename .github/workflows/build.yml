name: Build Fabric Mod

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle (Auto-locate gradlew)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew build
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew build
          else
            # Якщо gradlew лежить глибше або використовується інший шлях
            find . -name "gradlew" -exec chmod +x {} \;
            find . -name "gradlew" -exec {} build \;
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyVisual-Mod
          path: '**/build/libs/*
          .jar'
